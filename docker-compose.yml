version: "3.9"

services:

  # ── Baza danych ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nbp_currencies
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/nbp_currencies
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ── Frontend (Angular → nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "4200:80"
    depends_on:
      - backend

  # ── Testy backendu (pytest, SQLite in-memory) ─────────────────────────────────
  backend-test:
    build: ./backend
    profiles: ["test"]
    environment:
      DATABASE_URL: sqlite:///./test.db
    command: pytest tests/ -v --tb=short
    volumes:
      - ./backend:/app

  # ── Testy frontendu (Karma + ChromeHeadless) ──────────────────────────────────
  frontend-test:
    build:
      context: ./frontend
      target: test
    profiles: ["test"]
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
