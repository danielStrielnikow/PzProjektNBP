<div class="filters-panel">
  <h3>Filtry</h3>

  <div class="filter-row">
    <label>Rok</label>
    <input type="number" [(ngModel)]="filters.year" placeholder="np. 2024" min="2000" max="2099" />
  </div>

  <div class="filter-row">
    <label>Kwartał</label>
    <select [(ngModel)]="filters.quarter">
      <option [ngValue]="undefined">-- Wszystkie --</option>
      <option *ngFor="let q of quarters" [value]="q">Q{{ q }}</option>
    </select>
  </div>

  <div class="filter-row">
    <label>Miesiąc</label>
    <select [(ngModel)]="filters.month">
      <option [ngValue]="undefined">-- Wszystkie --</option>
      <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
    </select>
  </div>

  <div class="filter-row">
    <label>Dzień</label>
    <input type="number" [(ngModel)]="filters.day" placeholder="1-31" min="1" max="31" />
    <small>NBP nie publikuje kursów w weekendy i święta – dla takich dni brak wyników jest prawidłowy.</small>
  </div>

  <div class="filter-row">
    <label>Waluta</label>
    <input type="text" [(ngModel)]="filters.currency_code" placeholder="np. USD" maxlength="3" />
  </div>

  <div class="filter-actions">
    <button class="btn-primary" (click)="applyFilters()">Filtruj</button>
    <button class="btn-secondary" (click)="resetFilters()">Resetuj</button>
  </div>
</div>
